name: Materialize admin console
on:
  push:
    branches: [feature/admin-console]
    paths:
      - '.github/workflows/materialize-admin-console.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-console
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python .github/scripts/materialize_admin_console.py
      - run: |
          git config user.name gostop-bot
          git config user.email gostop-bot@users.noreply.github.com
          git add server/admin-ui.mjs server/worker.mjs tests/admin-console.test.js tests/admin-worker.test.js
          git diff --cached --check
          git commit -m "Add protected leaderboard and account admin console"
          git push origin HEAD:feature/admin-console
