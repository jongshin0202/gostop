name: Generate How To Play Video

on:
  push:
    branches:
      - feat/real-recorded-how-to-video
    paths:
      - scripts/generate-tutorial-footage.mjs
      - scripts/compose-tutorial-video.sh
      - .github/workflows/generate-how-to-play-video.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install video and browser tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak python3-pip
          python3 -m pip install --break-system-packages edge-tts
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start GoStop Live locally
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/gostop-video-server.log 2>&1 &
          echo $! > /tmp/gostop-video-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/gostop-video-server.log
          exit 1

      - name: Restore recorded tutorial footage
        id: footage-cache
        uses: actions/cache@v4
        with:
          path: |
            build/tutorial/part1-raw.webm
            build/tutorial/mobile-raw.webm
            build/tutorial/part2-raw.webm
            build/tutorial/captions.json
          key: tutorial-footage-${{ hashFiles('scripts/generate-tutorial-footage.mjs') }}

      - name: Record actual GoStop Live footage
        if: steps.footage-cache.outputs.cache-hit != 'true'
        run: node scripts/generate-tutorial-footage.mjs

      - name: Compose continuous narrated video
        run: bash scripts/compose-tutorial-video.sh

      - name: Commit generated video assets
        run: |
          git config user.name "gostop-video-bot"
          git config user.email "gostop-video-bot@users.noreply.github.com"
          git add assets/gostop-live-how-to-play.mp4 assets/gostop-live-how-to-play-poster.jpg assets/gostop-live-how-to-play-captions.json
          if git diff --cached --quiet; then
            echo "No generated asset changes."
            exit 0
          fi
          git commit -m "Generate recorded How to Play tutorial video"
          git push origin HEAD:feat/real-recorded-how-to-video
