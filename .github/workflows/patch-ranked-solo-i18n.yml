name: Apply ranked Solo presentation and localization patch

on:
  push:
    branches:
      - fix/ranked-solo-presentation-i18n
    paths:
      - .github/workflows/patch-ranked-solo-i18n.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ranked-solo-presentation-i18n
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply focused source patch
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          function replaceOnce(path,from,to){
            let text=fs.readFileSync(path,'utf8');
            if(!text.includes(from))throw new Error(`Expected source not found in ${path}: ${from.slice(0,100)}`);
            text=text.replace(from,to);
            fs.writeFileSync(path,text);
          }

          // Keep physically staged hand/deck cards alive through eventless authority syncs.
          replaceOnce('presentation-plan.js',
`  function planOnlinePresentation(events,initialStages={},context={}){`,
`  function pendingOnlineStageIds(state={}){\n    return [state?.pendingTurn?.played?.card?.id,state?.pendingTurn?.drawn?.card?.id].filter(Boolean);\n  }\n\n  function planOnlinePresentation(events,initialStages={},context={}){`);
          replaceOnce('presentation-plan.js',
`  const api=Object.freeze({planOnlinePresentation,isUpwardFlick,installHandFlickGestures,FLICK_DEFAULTS});`,
`  const api=Object.freeze({planOnlinePresentation,pendingOnlineStageIds,isUpwardFlick,installHandFlickGestures,FLICK_DEFAULTS});`);

          replaceOnce('app.js',
`      if(!presentationEvents.length){\n        // Authority can advance before the physical play event arrives. Do not render the\n        // selected card on the floor until a presentation step claims its exact source.\n        if(hasUnpresentedLocalHandMovement(incomingMapped.state,presentationEvents))return;\n        presentation.stagedCards.forEach((_,cardId)=>cleanupStagedCard(cardId));onlineStageState={};state=incomingMapped.state;onlineLastEvents=[];render();await driveOnline(snapshot,[]);return;\n      }`,
`      if(!presentationEvents.length){\n        // Eventless snapshots are sync/flow updates, not permission to erase an in-progress\n        // physical turn. Preserve any played/drawn cards that authority still owns in\n        // pendingTurn so a ranked Solo sync cannot make the played card disappear before\n        // the deck card is revealed and resolved.\n        if(hasUnpresentedLocalHandMovement(incomingMapped.state,presentationEvents))return;\n        const pendingStageIds=new Set(globalThis.GoStopPresentationPlan.pendingOnlineStageIds(incomingMapped.state));\n        for(const cardId of [...presentation.stagedCards.keys()])if(!pendingStageIds.has(cardId))cleanupStagedCard(cardId);\n        onlineStageState=Object.fromEntries(Object.entries(onlineStageState).filter(([cardId])=>pendingStageIds.has(cardId)));\n        state=incomingMapped.state;onlineLastEvents=[];render();await driveOnline(snapshot,[]);return;\n      }`);
          replaceOnce('app.js',
`    if(state)render();\n  }\n  function refreshModeLocalizedLabels(){`,
`    if(state)render();\n    globalThis.dispatchEvent?.(new CustomEvent('gostop-language-changed',{detail:{locale:presentation.locale}}));\n  }\n  function refreshModeLocalizedLabels(){`);

          // Unit coverage for the presentation invariant.
          replaceOnce('tests/presentation-plan.test.js',
`const {planOnlinePresentation,isUpwardFlick}=require('../presentation-plan.js');`,
`const {planOnlinePresentation,pendingOnlineStageIds,isUpwardFlick}=require('../presentation-plan.js');`);
          fs.appendFileSync('tests/presentation-plan.test.js',`\n\ntest('eventless authority sync preserves cards still owned by pending turn staging',()=>{\n  const state={pendingTurn:{played:{card:card('m2-1')},drawn:{card:card('m3-1')}}};\n  assert.deepEqual(pendingOnlineStageIds(state),['m2-1','m3-1']);\n  assert.deepEqual(pendingOnlineStageIds({pendingTurn:{played:{card:card('m2-1')},drawn:null}}),['m2-1']);\n  assert.deepEqual(pendingOnlineStageIds({}),[]);\n});\n`);

          // Ranked/account UI localization uses the same active locale as the base game.
          replaceOnce('ranked-client.js',
`  const $=id=>document.getElementById(id);`,
`  const $=id=>document.getElementById(id);\n  const rankedText=Object.freeze({\n    en:{coins:'Coins',practiceGame:'Practice Game',coinGames:'COIN GAMES',soloPlay:'Solo Play',onlinePlay:'Online Play',globalLeaderboard:'Global Leaderboard',monthlyLeaderboard:'Monthly Leaderboard',accountPitch:'Create an ID to play games with your friends and compete in the leaderboard.',createId:'Create ID',login:'Log In',logout:'Log Out',rank:'Rank #{rank}',provisionalRank:'Provisional #{rank}',unranked:'Unranked',inviteByEmail:'Invite by Email',inviteHelp:\"Enter a friend's email. Server email delivery will be enabled when the mail provider is connected; room-code sharing remains available now.\",sendInvite:'Send Invite',findOnline:'Find an Online Player',findOnlineHelp:'Search by nickname or choose one of the five online players closest to you by Score, Games Played, and Wallet Coins.',search:'Search',score:'Score',games:'Games',roomShare:'Room Code / Share Link',createRoomShare:'Create Room / Share Code',email:'Email',nickname:'Nickname',password:'Password',confirmPassword:'Confirm Password',passwordHelp:'Use at least 8 characters. Common passwords such as 12345 or qwerty are not accepted.',register:'Register',registeredTitle:'Account Registered Successfully',registeredBonus:'You received 100 signup bonus coins + 100 daily login bonus coins.',onlineRequest:'Online Play Request',totalCoins:'Total Coins',gamesPlayed:'Games Played',globalSub:'Overall global leaderboard to date',monthToDate:'{month} to date',currentMonth:'Current month',noRankedGames:'No ranked games yet.',rotateNote:'Global and Monthly pages rotate every 5 seconds.',attractNote:'Attract Mode · touch or click anywhere to return to the menu',pause:'Pause',pauseCount:'Pause ({count})',pauseYou:'You requested a one-minute pause.',pauseOpponent:'Your opponent requested a one-minute pause.',pausesLeft:'Your pauses remaining this game: {count}',yourTurn:'YOUR TURN!',waitingOpponent:'Waiting for Opponent',playNow:'Play Now