name: Solo continuity patch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/solo-card-continuity-replay
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python .github/scripts/apply_solo_continuity_replay.py
      - run: |
          git config user.name gostop-bot
          git config user.email gostop-bot@users.noreply.github.com
          git add app.js server/room-core.mjs tests/ranked-room.test.js tests/card-continuity.test.js
          git diff --cached --check
          git commit -m "Fix Solo card continuity and replay flow"
          git push origin HEAD:fix/solo-card-continuity-replay
