name: Test

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check app.js
          node --check audio-fanfare.js
          node --check audio-ppeok.js
          node --check audio-shake.js
          node --check diagnostics.js
          node --check game-engine.js
          node --check gostop-notifications-sw.js
          node --check i18n.js
          node --check mobile-fullscreen.js
          node --check online-client.js
          node --check presentation-plan.js
          node --check ranked-client.js
          node --check runtime-config.js
          node --check session-authority.js
          node --check admin.js
          node --check scripts/write-runtime-config.mjs
          node --check server/account-store.mjs
          node --check server/admin-api.mjs
          node --check server/backup-store.mjs
          node --check server/game-room.mjs
          node --check server/lobby.mjs
          node --check server/protocol.mjs
          node --check server/ranked-room-core.mjs
          node --check server/ranked-room-final.mjs
          node --check server/ranked-account-store.mjs
          node --check server/room-core.mjs
          node --check server/worker.mjs
      - name: Regression tests
        run: node --test tests/*.test.js
      - name: Isolated Training learner syntax and cadence tests
        run: |
          node --check training-learning/worker.mjs
          node --check training-learning/feedback-ui.js
          node --check training-learning/cloud-client.js
          node --check training-learning/update-cadence.mjs
          node --check training-learning/special-learner.mjs
          node --check training-learning/opening-learner.mjs
          node --check dev-site/training-opening-evidence.js
          node --check dev-site/training-opening-review.js
          node --test tests/training-learning-server.test.mjs tests/training-learning-offline.test.js tests/training-update-cadence.test.mjs tests/training-special-learner.test.mjs tests/training-opening-learner.test.mjs
      # Ubuntu 24.04 hosted runners sometimes route apt through an unavailable
      # Azure mirror, preventing Playwright's --with-deps step from ever running.
      # Replace only that mirror with the standard Ubuntu archive; preserve all
      # browser dependencies and the full end-to-end test requirements.
      - name: Configure resilient Ubuntu apt mirror for browser tests
        run: |
          for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$source" ]; then
              sudo sed -i 's@http://azure.archive.ubuntu.com/ubuntu@https://archive.ubuntu.com/ubuntu@g' "$source"
            fi
          done
          printf '%s\\n' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' 'Acquire::Retries "2";' | sudo tee /etc/apt/apt.conf.d/90-gostop-ci-mirror >/dev/null
      - name: Install browser test runner
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser end-to-end smoke tests
        run: npx playwright test
