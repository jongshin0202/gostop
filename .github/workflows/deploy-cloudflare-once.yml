name: Deploy Cloudflare Authority

on:
  push:
    branches:
      - main
    paths:
      - server/**
      - wrangler.toml
      - package.json
      - package-lock.json
      - .github/workflows/deploy-cloudflare-once.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-authority
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run regression tests
        run: npm test

      - name: Deploy authoritative Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.131.2'
          command: deploy
