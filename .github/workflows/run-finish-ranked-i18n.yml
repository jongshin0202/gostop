name: Finish ranked localization
on:
  push:
    branches: [fix/ranked-solo-presentation-i18n]
    paths: [.github/workflows/run-finish-ranked-i18n.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ranked-solo-presentation-i18n
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/finish_ranked_i18n.py
      - run: |
          git config user.name 'Jong-Wook Shin'
          git config user.email 'jwshin1@gmail.com'
          git add ranked-client.js
          git commit -m 'Complete ranked interface localization'
          git push origin HEAD:fix/ranked-solo-presentation-i18n
