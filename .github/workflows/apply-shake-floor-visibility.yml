name: Apply Shake floor visibility
on:
  push:
    branches: [fix/shake-floor-visible]
    paths:
      - '.github/workflows/apply-shake-floor-visibility.yml'
      - '.github/scripts/apply_shake_floor_visibility.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/shake-floor-visible
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python .github/scripts/apply_shake_floor_visibility.py
      - run: |
          git config user.name gostop-bot
          git config user.email gostop-bot@users.noreply.github.com
          git add styles.css tests/shake-floor-visibility.test.js
          git diff --cached --check
          git commit -m "Keep floor visible during Shake choice"
          git push origin HEAD:fix/shake-floor-visible
