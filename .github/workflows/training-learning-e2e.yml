name: Training Learning Focused Browser Tests (Dev Only)

on:
  push:
    branches: [develop]
    paths:
      - training-learning/**
      - tests/e2e/training-feedback.spec.mjs
      - .github/workflows/training-learning-e2e.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: training-learning-browser-dev
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Run isolated cross-device Training feedback tests
        run: npx playwright test tests/e2e/training-feedback.spec.mjs --workers=1
