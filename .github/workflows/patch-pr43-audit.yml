name: Apply PR43 audit patch

on:
  push:
    branches:
      - fix/two-floor-click-pipeline

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/two-floor-click-pipeline
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply audited ranked-input patch
        run: node scripts/patch-pr43-audit.mjs
      - name: Commit audited patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js tests/current-behavior.test.js tests/two-floor-click-pipeline.test.js
          if git diff --cached --quiet; then
            echo "No patch changes required"
          else
            git commit -m "Audit ranked card input state machine"
            git push origin HEAD:fix/two-floor-click-pipeline
          fi
