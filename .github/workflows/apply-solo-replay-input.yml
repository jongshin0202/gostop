name: Apply Solo replay input fix
on:
  push:
    branches: [fix/solo-replay-input]
    paths:
      - '.github/workflows/apply-solo-replay-input.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/solo-replay-input
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python .github/scripts/apply_solo_replay_input.py
      - run: rm .github/scripts/apply_solo_replay_input.py .github/workflows/apply-solo-replay-input.yml
      - run: |
          git config user.name gostop-bot
          git config user.email gostop-bot@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Fix Solo replay input unlock"
          git push origin HEAD:fix/solo-replay-input
